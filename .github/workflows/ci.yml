name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/thinkstack_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-long
      JUDGE0_MOCK: 'true'
      GEMINI_MOCK: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Lint backend
        run: npm run lint -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Run backend tests
        run: npm run test -w backend
